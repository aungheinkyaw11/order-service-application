name: Application CI

on:
  pull_request:
    branches:
      - development
      - main
  push:
    branches:
      - development
      - main
  workflow_dispatch:

concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_ACCOUNT_ID: "499193102935"
  AWS_REGION: us-east-1
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build test image
        run: docker build --target development --tag order-service-test:${GITHUB_SHA} .

      - name: Check lint and formatting
        run: |
          docker run --rm --volume "${GITHUB_WORKSPACE}:/src" --workdir /src order-service-test:${GITHUB_SHA} ruff check .
          docker run --rm --volume "${GITHUB_WORKSPACE}:/src" --workdir /src order-service-test:${GITHUB_SHA} ruff format --check .

      - name: Run unit tests
        run: docker run --rm --volume "${GITHUB_WORKSPACE}:/src" --workdir /src order-service-test:${GITHUB_SHA} pytest -q -p no:cacheprovider tests

  publish-dev:
    name: Build and push development image
    if: github.ref == 'refs/heads/development' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ECR_REPOSITORY: order-service-dev

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Assume development AWS role
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_DEV_ROLE_ARN }}
          role-session-name: github-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Check whether image already exists
        id: image
        run: |
          if aws ecr describe-images --repository-name "${ECR_REPOSITORY}" --image-ids "imageTag=${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "sha_exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "sha_exists=false" >> "${GITHUB_OUTPUT}"
          fi
          if aws ecr describe-images --repository-name "${ECR_REPOSITORY}" --image-ids "imageTag=bootstrap" >/dev/null 2>&1; then
            echo "bootstrap_exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "bootstrap_exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build image
        if: steps.image.outputs.sha_exists != 'true'
        env:
          IMAGE_URI: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
        run: docker build --build-arg IMAGE_VERSION="${GITHUB_SHA}" --tag "${IMAGE_URI}" .

      - name: Push image
        if: steps.image.outputs.sha_exists != 'true'
        env:
          IMAGE_URI: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
        run: |
          docker push "${IMAGE_URI}"
          echo "Published \`${IMAGE_URI}\`" >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish initial bootstrap image
        if: steps.image.outputs.bootstrap_exists != 'true'
        env:
          REGISTRY_URI: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}
        run: |
          if ! docker image inspect "${REGISTRY_URI}:${IMAGE_TAG}" >/dev/null 2>&1; then
            docker pull "${REGISTRY_URI}:${IMAGE_TAG}"
          fi
          docker tag "${REGISTRY_URI}:${IMAGE_TAG}" "${REGISTRY_URI}:bootstrap"
          docker push "${REGISTRY_URI}:bootstrap"
          echo "Published initial \`${REGISTRY_URI}:bootstrap\`" >> "${GITHUB_STEP_SUMMARY}"

  deploy-dev:
    name: Deploy development to ECS
    if: github.ref == 'refs/heads/development' && github.event_name != 'pull_request'
    needs: publish-dev
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    env:
      ECS_CLUSTER: order-service-dev-cluster
      API_SERVICE: order-service-dev-api
      WORKER_SERVICE: order-service-dev-worker
      MIGRATION_TASK_FAMILY: order-service-dev-migration
      IMAGE_URI: 499193102935.dkr.ecr.us-east-1.amazonaws.com/order-service-dev:${{ github.sha }}
      DEPLOY_ENV: dev

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Assume development AWS role
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_DEV_ROLE_ARN }}
          role-session-name: deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Run migration and deploy ECS services
        run: ./scripts/deploy_ecs.sh

  release-prod:
    name: Approve and deploy production to ECS
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # GitHub pauses this job until an approved reviewer allows the prod environment deployment.
    environment:
      name: prod

    permissions:
      contents: read
      id-token: write

    env:
      ECR_REPOSITORY: order-service-prod
      ECS_CLUSTER: order-service-prod-cluster
      API_SERVICE: order-service-prod-api
      WORKER_SERVICE: order-service-prod-worker
      MIGRATION_TASK_FAMILY: order-service-prod-migration
      IMAGE_URI: 499193102935.dkr.ecr.us-east-1.amazonaws.com/order-service-prod:${{ github.sha }}
      DEPLOY_ENV: prod

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Assume production AWS role after approval
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_PROD_ROLE_ARN }}
          role-session-name: production-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Check whether production image already exists
        id: prod-image
        run: |
          if aws ecr describe-images --repository-name "${ECR_REPOSITORY}" --image-ids "imageTag=${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "sha_exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "sha_exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build production image
        if: steps.prod-image.outputs.sha_exists != 'true'
        run: docker build --build-arg IMAGE_VERSION="${GITHUB_SHA}" --tag "${IMAGE_URI}" .

      - name: Push production image
        if: steps.prod-image.outputs.sha_exists != 'true'
        run: |
          docker push "${IMAGE_URI}"
          echo "Published production image \`${IMAGE_URI}\`" >> "${GITHUB_STEP_SUMMARY}"

      - name: Run production migration and deploy ECS services
        run: ./scripts/deploy_ecs.sh
