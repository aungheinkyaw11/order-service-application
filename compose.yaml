name: order-service

services:
  postgres:
    image: postgres:16.9-alpine
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  nats:
    image: nats:2.11.6-alpine
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  migrate:
    build:
      context: .
      args:
        IMAGE_VERSION: ${IMAGE_VERSION:-local}
    image: order-service:local
    command: ["python", "-m", "app.migrate"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: order-service:local
    command: ["python", "-m", "app.api_entrypoint"]
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  worker:
    image: order-service:local
    command: ["python", "-m", "app.worker"]
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  integration-test:
    build:
      context: .
      target: development
    image: order-service-test:local
    profiles: ["test"]
    command: ["pytest", "-q", "-p", "no:cacheprovider", "tests/test_integration.py"]
    env_file: .env
    environment:
      API_URL: http://api:8000
      RUN_INTEGRATION: "1"
    volumes:
      - .:/src:ro
    working_dir: /src
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy

volumes:
  postgres-data:
  nats-data:
